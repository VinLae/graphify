<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1084" viewBox="0 0 1440 1084" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1440" height="1084" fill="#ffffff"/>

  <!-- Dimension I -->
  <g>
    <rect x="40" y="40" width="1360" height="180" rx="8" fill="#f7f9fb" stroke="#31506e" stroke-width="1.5"/>
    <text x="720" y="76" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a2733">Aggregierte Dimension I:</text>
    <text x="720" y="102" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a2733">Ontologische Rekonzeptualisierung von Risiko</text>
    <rect x="65" y="132" width="420" height="64" rx="6" fill="#eef2f7" stroke="#5b7a99" stroke-width="1.2"/>
    <text x="275" y="159" text-anchor="middle" font-size="16" fill="#1a2733">Kritik der Varianz- und</text>
    <text x="275" y="181" text-anchor="middle" font-size="16" fill="#1a2733">Ereignislogik</text>
    <rect x="510" y="132" width="420" height="64" rx="6" fill="#eef2f7" stroke="#5b7a99" stroke-width="1.2"/>
    <text x="720" y="159" text-anchor="middle" font-size="16" fill="#1a2733">Unsicherheit als</text>
    <text x="720" y="181" text-anchor="middle" font-size="16" fill="#1a2733">Kontextbedingung</text>
    <rect x="955" y="132" width="420" height="64" rx="6" fill="#eef2f7" stroke="#5b7a99" stroke-width="1.2"/>
    <text x="1165" y="159" text-anchor="middle" font-size="16" fill="#1a2733">Risiko als sozial konstruiertes,</text>
    <text x="1165" y="181" text-anchor="middle" font-size="16" fill="#1a2733">emergentes Phänomen</text>
  </g>

  <!-- Dimension II -->
  <g>
    <rect x="40" y="246" width="1360" height="180" rx="8" fill="#f7f9fb" stroke="#31506e" stroke-width="1.5"/>
    <text x="720" y="282" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a2733">Aggregierte Dimension II:</text>
    <text x="720" y="308" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a2733">Entkopplung von Formalstruktur und gelebter Praxis</text>
    <rect x="65" y="338" width="420" height="64" rx="6" fill="#eef2f7" stroke="#5b7a99" stroke-width="1.2"/>
    <text x="275" y="365" text-anchor="middle" font-size="16" fill="#1a2733">Rituelle Entleerung</text>
    <text x="275" y="387" text-anchor="middle" font-size="16" fill="#1a2733">formaler Praktiken</text>
    <rect x="510" y="338" width="420" height="64" rx="6" fill="#eef2f7" stroke="#5b7a99" stroke-width="1.2"/>
    <text x="720" y="365" text-anchor="middle" font-size="16" fill="#1a2733">Soziale und kognitive</text>
    <text x="720" y="387" text-anchor="middle" font-size="16" fill="#1a2733">Interventionsbedingungen</text>
    <rect x="955" y="338" width="420" height="64" rx="6" fill="#eef2f7" stroke="#5b7a99" stroke-width="1.2"/>
    <text x="1165" y="365" text-anchor="middle" font-size="16" fill="#1a2733">Informelle, situierte</text>
    <text x="1165" y="387" text-anchor="middle" font-size="16" fill="#1a2733">Risikoarbeit</text>
  </g>

  <!-- Dimension III -->
  <g>
    <rect x="40" y="452" width="1360" height="180" rx="8" fill="#f7f9fb" stroke="#31506e" stroke-width="1.5"/>
    <text x="720" y="488" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a2733">Aggregierte Dimension III:</text>
    <text x="720" y="514" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a2733">Temporalität und Risikotrajektorien</text>
    <rect x="65" y="544" width="420" height="64" rx="6" fill="#eef2f7" stroke="#5b7a99" stroke-width="1.2"/>
    <text x="275" y="582" text-anchor="middle" font-size="16" fill="#1a2733">Risikobiografien</text>
    <rect x="510" y="544" width="420" height="64" rx="6" fill="#eef2f7" stroke="#5b7a99" stroke-width="1.2"/>
    <text x="720" y="571" text-anchor="middle" font-size="16" fill="#1a2733">Pfadabhängigkeit und</text>
    <text x="720" y="593" text-anchor="middle" font-size="16" fill="#1a2733">Eskalationsdynamiken</text>
    <rect x="955" y="544" width="420" height="64" rx="6" fill="#eef2f7" stroke="#5b7a99" stroke-width="1.2"/>
    <text x="1165" y="571" text-anchor="middle" font-size="16" fill="#1a2733">Sequenz- und Variabilitätslogik</text>
    <text x="1165" y="593" text-anchor="middle" font-size="16" fill="#1a2733">des Prozesses</text>
  </g>

  <!-- Dimension IV -->
  <g>
    <rect x="40" y="658" width="1360" height="180" rx="8" fill="#f7f9fb" stroke="#31506e" stroke-width="1.5"/>
    <text x="720" y="694" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a2733">Aggregierte Dimension IV:</text>
    <text x="720" y="720" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a2733">Narrativ-diskursive Konstitution des Risikomanagements</text>
    <rect x="270" y="750" width="420" height="64" rx="6" fill="#eef2f7" stroke="#5b7a99" stroke-width="1.2"/>
    <text x="480" y="788" text-anchor="middle" font-size="16" fill="#1a2733">Risiken als Erzählungen</text>
    <rect x="750" y="750" width="420" height="64" rx="6" fill="#eef2f7" stroke="#5b7a99" stroke-width="1.2"/>
    <text x="960" y="777" text-anchor="middle" font-size="16" fill="#1a2733">Legitimation und</text>
    <text x="960" y="799" text-anchor="middle" font-size="16" fill="#1a2733">Identitätsarbeit</text>
  </g>

  <!-- Dimension V -->
  <g>
    <rect x="40" y="864" width="1360" height="180" rx="8" fill="#f7f9fb" stroke="#31506e" stroke-width="1.5"/>
    <text x="720" y="900" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a2733">Aggregierte Dimension V:</text>
    <text x="720" y="926" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a2733">Wert als prozessuale Zuschreibung</text>
    <rect x="270" y="956" width="420" height="64" rx="6" fill="#eef2f7" stroke="#5b7a99" stroke-width="1.2"/>
    <text x="480" y="983" text-anchor="middle" font-size="16" fill="#1a2733">Stakeholderabhängige</text>
    <text x="480" y="1005" text-anchor="middle" font-size="16" fill="#1a2733">Wertkonstruktion</text>
    <rect x="750" y="956" width="420" height="64" rx="6" fill="#eef2f7" stroke="#5b7a99" stroke-width="1.2"/>
    <text x="960" y="983" text-anchor="middle" font-size="16" fill="#1a2733">Verhandlung des Werts</text>
    <text x="960" y="1005" text-anchor="middle" font-size="16" fill="#1a2733">im Zeitverlauf</text>
  </g>
</svg>
